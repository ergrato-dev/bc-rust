<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540">
  <style>
    .T  { font-family:'Segoe UI',sans-serif; font-size:22px; font-weight:700; fill:#d4d4d4; }
    .S  { font-family:'Segoe UI',sans-serif; font-size:12px; fill:#808080; }
    .H  { font-family:'Segoe UI',sans-serif; font-size:13px; font-weight:700; fill:#CE422B; }
    .L  { font-family:'Segoe UI',sans-serif; font-size:12px; font-weight:600; fill:#d4d4d4; }
    .M  { font-family:'Segoe UI',sans-serif; font-size:11px; fill:#a0a0a0; }
    .X  { font-family:'Segoe UI',sans-serif; font-size:9.5px; fill:#6a6a6a; }
    .C  { font-family:'Fira Code','Consolas',monospace; font-size:10px; fill:#d4d4d4; }
    .K  { font-family:'Fira Code','Consolas',monospace; font-size:10px; fill:#569cd6; }
    .G  { font-family:'Fira Code','Consolas',monospace; font-size:9px; fill:#6a9955; }
    .OR { font-family:'Fira Code','Consolas',monospace; font-size:9px; fill:#ce9178; }
    .YL { font-family:'Fira Code','Consolas',monospace; font-size:9px; fill:#dcdcaa; }
  </style>

  <rect width="860" height="540" fill="#1e1e1e"/>

  <!-- Header -->
  <text x="430" y="34" class="T" text-anchor="middle">`std::mem` — Cheatsheet de Manipulación de Memoria</text>
  <text x="430" y="52" class="S" text-anchor="middle">safe functions · unsafe functions · MaybeUninit</text>
  <line x1="40" y1="62" x2="820" y2="62" stroke="#3c3c3c"/>

  <!-- SAFE functions group -->
  <text x="50" y="83" class="H">Funciones SAFE</text>
  <line x1="50" y1="88" x2="420" y2="88" stroke="#6a9955" stroke-width="1.5"/>

  <!-- size_of / align_of -->
  <rect x="50" y="94" width="180" height="105" rx="5" fill="#252526" stroke="#3c3c3c"/>
  <text x="140" y="112" class="L" text-anchor="middle" fill="#4ec9b0">size_of / align_of</text>
  <text x="65" y="129" class="YL">mem::size_of::&lt;u32&gt;()</text>
  <text x="65" y="144" class="G">→ 4</text>
  <text x="65" y="160" class="YL">mem::align_of::&lt;u64&gt;()</text>
  <text x="65" y="175" class="G">→ 8</text>
  <text x="65" y="190" class="G">// Compile-time const</text>

  <!-- replace / take -->
  <rect x="240" y="94" width="180" height="105" rx="5" fill="#252526" stroke="#3c3c3c"/>
  <text x="330" y="112" class="L" text-anchor="middle" fill="#4ec9b0">replace / take</text>
  <text x="255" y="129" class="YL">mem::replace(&amp;mut s, new)</text>
  <text x="255" y="144" class="G">→ retorna el viejo</text>
  <text x="255" y="160" class="YL">mem::take(&amp;mut v)</text>
  <text x="255" y="175" class="G">→ retorna, deja Default</text>
  <text x="255" y="190" class="G">// Sin clonar</text>

  <!-- swap -->
  <rect x="50" y="208" width="180" height="85" rx="5" fill="#252526" stroke="#3c3c3c"/>
  <text x="140" y="226" class="L" text-anchor="middle" fill="#4ec9b0">swap / drop</text>
  <text x="65" y="244" class="YL">mem::swap(&amp;mut a, &amp;mut b)</text>
  <text x="65" y="259" class="G">// intercambia in-place</text>
  <text x="65" y="275" class="YL">mem::drop(val)</text>
  <text x="65" y="290" class="G">// Drop explícito</text>

  <!-- forget -->
  <rect x="240" y="208" width="180" height="85" rx="5" fill="#252526" stroke="#dcdcaa" stroke-width="1.2"/>
  <text x="330" y="226" class="L" text-anchor="middle" fill="#dcdcaa">forget</text>
  <text x="255" y="244" class="YL">mem::forget(val)</text>
  <text x="255" y="260" class="G">// No llama a Drop</text>
  <text x="255" y="276" class="G">// Produce memory leak</text>
  <text x="255" y="290" class="G">// Útil: Box::into_raw</text>

  <!-- UNSAFE functions group -->
  <text x="450" y="83" class="H">Funciones UNSAFE</text>
  <line x1="450" y1="88" x2="820" y2="88" stroke="#CE422B" stroke-width="1.5"/>

  <!-- transmute -->
  <rect x="450" y="94" width="360" height="105" rx="5" fill="#252526" stroke="#CE422B" stroke-width="1.5"/>
  <text x="630" y="112" class="L" text-anchor="middle" fill="#CE422B">transmute — La más peligrosa</text>
  <text x="465" y="130" class="G">// SAFETY: f32 y u32 mismo tamaño (4B)</text>
  <text x="465" y="146" class="K">let</text>
  <text x="489" y="146" class="C"> bits: u32 = </text>
  <text x="557" y="146" class="K">unsafe</text>
  <text x="597" y="146" class="C"> {</text>
  <text x="465" y="162" class="C">  mem::transmute(1.0_f32)</text>
  <text x="465" y="178" class="C">};</text>
  <text x="465" y="192" class="G">// bits == 0x3F800000</text>

  <!-- MaybeUninit -->
  <rect x="450" y="208" width="360" height="85" rx="5" fill="#252526" stroke="#569cd6" stroke-width="1.5"/>
  <text x="630" y="226" class="L" text-anchor="middle" fill="#569cd6">MaybeUninit&lt;T&gt; — Inicialización diferida</text>
  <text x="465" y="244" class="K">let mut</text>
  <text x="507" y="244" class="C"> v = MaybeUninit::uninit();</text>
  <text x="465" y="260" class="K">unsafe</text>
  <text x="500" y="260" class="C"> { v.as_mut_ptr().write(42); }</text>
  <text x="465" y="276" class="G">// SAFETY: inicializado arriba</text>
  <text x="465" y="290" class="K">let</text>
  <text x="489" y="290" class="C"> x = </text>
  <text x="514" y="290" class="K">unsafe</text>
  <text x="552" y="290" class="C"> { v.assume_init() };</text>

  <!-- Bottom: comparisons table -->
  <line x1="40" y1="308" x2="820" y2="308" stroke="#3c3c3c"/>
  <text x="430" y="328" class="H" text-anchor="middle">Alternativas Seguras a `transmute`</text>

  <rect x="50" y="338" width="760" height="100" rx="6" fill="#252526" stroke="#3c3c3c"/>

  <!-- Col headers -->
  <text x="120" y="358" class="X" text-anchor="middle" fill="#CE422B">Con transmute (unsafe)</text>
  <text x="430" y="358" class="X" text-anchor="middle" fill="#6a9955">Alternativa safe</text>
  <text x="700" y="358" class="X" text-anchor="middle" fill="#808080">Notas</text>
  <line x1="60" y1="363" x2="800" y2="363" stroke="#3c3c3c"/>

  <text x="65" y="380" class="OR">transmute::&lt;f32, u32&gt;(f)</text>
  <text x="335" y="380" class="G">f32::to_bits(f)</text>
  <text x="570" y="380" class="X">sin unsafe, idiomático</text>

  <text x="65" y="397" class="OR">transmute::&lt;u32, f32&gt;(n)</text>
  <text x="335" y="397" class="G">f32::from_bits(n)</text>
  <text x="570" y="397" class="X">sin unsafe, idiomático</text>

  <text x="65" y="414" class="OR">transmute::&lt;Enum, u8&gt;(e)</text>
  <text x="335" y="414" class="G">e as u8  (con #[repr(u8)])</text>
  <text x="570" y="414" class="X">requiere repr correcto</text>

  <text x="65" y="431" class="OR">transmute para init diferida</text>
  <text x="335" y="431" class="G">MaybeUninit::assume_init()</text>
  <text x="570" y="431" class="X">forma idiomática moderna</text>

  <!-- needs_drop bottom note -->
  <rect x="50" y="453" width="760" height="40" rx="6" fill="#252526" stroke="#454545"/>
  <text x="430" y="470" class="L" text-anchor="middle">Funciones de Inspección</text>
  <text x="430" y="486" class="X" text-anchor="middle">mem::needs_drop::&lt;T&gt;()  ·  mem::discriminant(&amp;enum_val)  ·  mem::size_of_val(&amp;val)  ·  mem::align_of_val(&amp;val)</text>
</svg>
