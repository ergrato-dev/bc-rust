<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520">
  <style>
    .T  { font-family:'Segoe UI',sans-serif; font-size:22px; font-weight:700; fill:#d4d4d4; }
    .S  { font-family:'Segoe UI',sans-serif; font-size:12px; fill:#808080; }
    .H  { font-family:'Segoe UI',sans-serif; font-size:13px; font-weight:700; fill:#CE422B; }
    .L  { font-family:'Segoe UI',sans-serif; font-size:12px; font-weight:600; fill:#d4d4d4; }
    .M  { font-family:'Segoe UI',sans-serif; font-size:11px; fill:#a0a0a0; }
    .X  { font-family:'Segoe UI',sans-serif; font-size:9.5px; fill:#6a6a6a; }
    .C  { font-family:'Fira Code','Consolas',monospace; font-size:10px; fill:#d4d4d4; }
    .K  { font-family:'Fira Code','Consolas',monospace; font-size:10px; fill:#569cd6; }
    .NG { font-family:'Fira Code','Consolas',monospace; font-size:9px; fill:#4ec9b0; }
    .OR { font-family:'Fira Code','Consolas',monospace; font-size:9px; fill:#ce9178; }
  </style>

  <rect width="860" height="520" fill="#1e1e1e"/>

  <!-- Header -->
  <text x="430" y="34" class="T" text-anchor="middle">Anatomía de Raw Pointers: `*const T` y `*mut T`</text>
  <text x="430" y="52" class="S" text-anchor="middle">Crear un raw pointer es safe · desreferenciarlo requiere unsafe</text>
  <line x1="40" y1="62" x2="820" y2="62" stroke="#3c3c3c"/>

  <!-- Memory diagram: stack -->
  <text x="130" y="90" class="H" text-anchor="middle">Stack Frame</text>
  <rect x="50" y="98" width="160" height="180" rx="6" fill="#252526" stroke="#454545"/>
  <!-- stack slots -->
  <rect x="60" y="108" width="140" height="28" rx="3" fill="#2d2d2d" stroke="#3c3c3c"/>
  <text x="130" y="127" class="C" text-anchor="middle">x: i32 = 42</text>
  <rect x="60" y="142" width="140" height="28" rx="3" fill="#2d2d2d" stroke="#3c3c3c"/>
  <text x="130" y="161" class="C" text-anchor="middle">y: i32 = 99</text>
  <rect x="60" y="176" width="140" height="28" rx="3" fill="#2d2d2d" stroke="#569cd6" stroke-width="1.5"/>
  <text x="130" y="195" class="K" text-anchor="middle">ptr: *const i32</text>
  <rect x="60" y="210" width="140" height="28" rx="3" fill="#2d2d2d" stroke="#CE422B" stroke-width="1.5"/>
  <text x="130" y="229" class="C" text-anchor="middle" fill="#CE422B">mut_ptr: *mut i32</text>

  <!-- Arrow from ptr to x -->
  <line x1="200" y1="190" x2="240" y2="120" stroke="#569cd6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="240,112 236,124 248,120" fill="#569cd6"/>
  <line x1="200" y1="224" x2="240" y2="158" stroke="#CE422B" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="240,150 236,162 248,158" fill="#CE422B"/>

  <!-- Legend types -->
  <rect x="260" y="88" width="550" height="200" rx="6" fill="#252526" stroke="#3c3c3c"/>
  <text x="535" y="108" class="L" text-anchor="middle">Comparación de Tipos Puntero</text>
  <line x1="270" y1="115" x2="800" y2="115" stroke="#3c3c3c"/>

  <!-- Table header -->
  <text x="290" y="133" class="X" fill="#808080">Propiedad</text>
  <text x="430" y="133" class="X" fill="#569cd6" text-anchor="middle">&amp;T</text>
  <text x="520" y="133" class="X" fill="#4ec9b0" text-anchor="middle">&amp;mut T</text>
  <text x="620" y="133" class="X" fill="#569cd6" text-anchor="middle">*const T</text>
  <text x="720" y="133" class="X" fill="#CE422B" text-anchor="middle">*mut T</text>
  <line x1="270" y1="138" x2="800" y2="138" stroke="#3c3c3c"/>

  <!-- Rows -->
  <text x="290" y="153" class="X">Lifetime</text>
  <text x="430" y="153" class="X" fill="#6a9955" text-anchor="middle">✓ verificado</text>
  <text x="520" y="153" class="X" fill="#6a9955" text-anchor="middle">✓ verificado</text>
  <text x="620" y="153" class="X" fill="#CE422B" text-anchor="middle">✗ ninguno</text>
  <text x="720" y="153" class="X" fill="#CE422B" text-anchor="middle">✗ ninguno</text>

  <text x="290" y="169" class="X">Puede ser null</text>
  <text x="430" y="169" class="X" fill="#6a9955" text-anchor="middle">✗ siempre válida</text>
  <text x="520" y="169" class="X" fill="#6a9955" text-anchor="middle">✗ siempre válida</text>
  <text x="620" y="169" class="X" fill="#CE422B" text-anchor="middle">✓ puede ser null</text>
  <text x="720" y="169" class="X" fill="#CE422B" text-anchor="middle">✓ puede ser null</text>

  <text x="290" y="185" class="X">Aliasing</text>
  <text x="430" y="185" class="X" fill="#6a9955" text-anchor="middle">✓ borrow check</text>
  <text x="520" y="185" class="X" fill="#6a9955" text-anchor="middle">✓ exclusivo</text>
  <text x="620" y="185" class="X" fill="#CE422B" text-anchor="middle">✗ sin verificar</text>
  <text x="720" y="185" class="X" fill="#CE422B" text-anchor="middle">✗ sin verificar</text>

  <text x="290" y="201" class="X">Desreferenciar</text>
  <text x="430" y="201" class="X" fill="#6a9955" text-anchor="middle">✓ safe</text>
  <text x="520" y="201" class="X" fill="#6a9955" text-anchor="middle">✓ safe</text>
  <text x="620" y="201" class="X" fill="#CE422B" text-anchor="middle">✗ requiere unsafe</text>
  <text x="720" y="201" class="X" fill="#CE422B" text-anchor="middle">✗ requiere unsafe</text>

  <text x="290" y="217" class="X">Aritmética de ptr</text>
  <text x="430" y="217" class="X" fill="#808080" text-anchor="middle">—</text>
  <text x="520" y="217" class="X" fill="#808080" text-anchor="middle">—</text>
  <text x="620" y="217" class="X" fill="#dcdcaa" text-anchor="middle">✓ .add() .offset()</text>
  <text x="720" y="217" class="X" fill="#dcdcaa" text-anchor="middle">✓ .add() .offset()</text>

  <text x="290" y="233" class="X">Mutabilidad</text>
  <text x="430" y="233" class="X" fill="#808080" text-anchor="middle">solo lectura</text>
  <text x="520" y="233" class="X" fill="#4ec9b0" text-anchor="middle">lectura/escritura</text>
  <text x="620" y="233" class="X" fill="#808080" text-anchor="middle">solo lectura</text>
  <text x="720" y="233" class="X" fill="#CE422B" text-anchor="middle">lectura/escritura</text>

  <!-- Code examples section -->
  <text x="430" y="310" class="H" text-anchor="middle">Patrones de Uso</text>
  <line x1="40" y1="318" x2="820" y2="318" stroke="#3c3c3c"/>

  <!-- Create box -->
  <rect x="50" y="325" width="370" height="115" rx="6" fill="#252526" stroke="#3c3c3c"/>
  <text x="235" y="344" class="L" text-anchor="middle">Crear raw pointers (siempre safe)</text>
  <text x="65" y="362" class="K">let</text>
  <text x="90" y="362" class="C"> x = 42_i32;</text>
  <text x="65" y="377" class="K">let</text>
  <text x="90" y="377" class="C"> ptr: *const i32 = &amp;x;</text>
  <text x="65" y="392" class="K">let</text>
  <text x="90" y="392" class="C"> null = std::ptr::null::&lt;i32&gt;();</text>
  <text x="65" y="407" class="K">let</text>
  <text x="90" y="407" class="C"> nn = NonNull::from(&amp;x);</text>
  <text x="65" y="422" class="NG">// Crear es safe — desreferenciar no</text>

  <!-- Deref box -->
  <rect x="440" y="325" width="370" height="115" rx="6" fill="#252526" stroke="#CE422B" stroke-width="1.2"/>
  <text x="625" y="344" class="L" text-anchor="middle">Desreferenciar (requiere unsafe)</text>
  <text x="455" y="362" class="NG">// SAFETY: ptr apunta a x en este scope.</text>
  <text x="455" y="377" class="NG">// Sin aliasing mutable sobre x.</text>
  <text x="455" y="392" class="K">let</text>
  <text x="480" y="392" class="C"> val = </text>
  <text x="519" y="392" class="K">unsafe</text>
  <text x="557" y="392" class="C"> { *ptr };</text>
  <text x="455" y="407" class="K">unsafe</text>
  <text x="493" y="407" class="C"> { *mut_ptr = 100; }</text>
  <text x="455" y="422" class="NG">// Aritmética: ptr.add(n), ptr.offset(n)</text>

  <!-- NonNull vs raw -->
  <rect x="50" y="455" width="760" height="50" rx="6" fill="#252526" stroke="#4ec9b0" stroke-width="1.2"/>
  <text x="430" y="474" class="H" text-anchor="middle" fill="#4ec9b0">NonNull&lt;T&gt; — Preferido en APIs internas</text>
  <text x="430" y="492" class="C" text-anchor="middle">Option&lt;NonNull&lt;T&gt;&gt; tiene el mismo tamaño que *mut T  ·  garantiza non-null  ·  covariant en T</text>
</svg>
