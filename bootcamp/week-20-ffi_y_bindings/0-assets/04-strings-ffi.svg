<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540">
  <style>
    .title   { font-family: 'Segoe UI', sans-serif; font-size: 22px; font-weight: 700; fill: #d4d4d4; }
    .sub     { font-family: 'Segoe UI', sans-serif; font-size: 13px; fill: #808080; }
    .label   { font-family: 'Segoe UI', sans-serif; font-size: 13px; fill: #d4d4d4; }
    .small   { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #808080; }
    .code    { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #d4d4d4; }
    .kw      { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #569cd6; }
    .fn      { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #dcdcaa; }
    .str     { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #ce9178; }
    .type    { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #4ec9b0; }
    .comment { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #6a9955; }
    .danger  { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #CE422B; }
  </style>

  <rect width="900" height="540" fill="#1e1e1e"/>

  <text x="450" y="40" text-anchor="middle" class="title">Strings en FFI: CStr, CString, *const c_char</text>
  <text x="450" y="60" text-anchor="middle" class="sub">Modelos de string · Conversiones seguras · Peligros del dangling pointer</text>
  <line x1="40" y1="72" x2="860" y2="72" stroke="#3c3c3c" stroke-width="1"/>

  <!-- TOP: Model comparison -->
  <rect x="40" y="88" width="820" height="100" rx="6" fill="#252526" stroke="#454545"/>
  <text x="450" y="108" text-anchor="middle" class="label" font-weight="700">Modelos de String: Rust vs C</text>

  <!-- Rust str -->
  <rect x="60" y="116" width="350" height="58" rx="4" fill="#2d2d2d" stroke="#569cd6" stroke-opacity="0.5"/>
  <text x="235" y="132" text-anchor="middle" class="label" fill="#569cd6">Rust &amp;str / String</text>
  <!-- bytes visualization -->
  <text x="70" y="153" class="small">mem: </text>
  <rect x="100" y="140" width="22" height="18" rx="2" fill="#569cd6" fill-opacity="0.3"/>
  <text x="111" y="153" text-anchor="middle" class="code">'h'</text>
  <rect x="124" y="140" width="22" height="18" rx="2" fill="#569cd6" fill-opacity="0.3"/>
  <text x="135" y="153" text-anchor="middle" class="code">'i'</text>
  <rect x="148" y="140" width="22" height="18" rx="2" fill="#569cd6" fill-opacity="0.3"/>
  <text x="159" y="153" text-anchor="middle" class="code">'!'</text>
  <text x="178" y="153" class="small" fill="#808080">+ len=3 (fat ptr)</text>
  <text x="70" y="169" class="small">UTF-8 garantizado · SIN null terminator</text>

  <!-- C char* -->
  <rect x="430" y="116" width="410" height="58" rx="4" fill="#2d2d2d" stroke="#CE422B" stroke-opacity="0.5"/>
  <text x="635" y="132" text-anchor="middle" class="label" fill="#CE422B">C const char *</text>
  <text x="442" y="153" class="small">mem: </text>
  <rect x="474" y="140" width="22" height="18" rx="2" fill="#CE422B" fill-opacity="0.3"/>
  <text x="485" y="153" text-anchor="middle" class="code">'h'</text>
  <rect x="498" y="140" width="22" height="18" rx="2" fill="#CE422B" fill-opacity="0.3"/>
  <text x="509" y="153" text-anchor="middle" class="code">'i'</text>
  <rect x="522" y="140" width="22" height="18" rx="2" fill="#CE422B" fill-opacity="0.3"/>
  <text x="533" y="153" text-anchor="middle" class="code">'!'</text>
  <rect x="546" y="140" width="22" height="18" rx="2" fill="#CE422B" fill-opacity="0.6"/>
  <text x="557" y="153" text-anchor="middle" class="code" fill="#CE422B">\0</text>
  <text x="576" y="153" class="small" fill="#808080">thin ptr · DEBE tener null terminator</text>
  <text x="442" y="169" class="small">Bytes arbitrarios · NO garantiza UTF-8</text>

  <!-- MIDDLE: Two main types -->
  <rect x="40" y="208" width="400" height="180" rx="6" fill="#252526" stroke="#454545"/>
  <text x="240" y="228" text-anchor="middle" class="label" font-weight="700">CString — Rust crea para C</text>
  <text x="240" y="246" text-anchor="middle" class="small">Owned · null-terminated · heap</text>

  <rect x="56" y="256" width="368" height="118" rx="4" fill="#2d2d2d"/>
  <text x="68" y="272" class="kw">let </text>
  <text x="90" y="272" class="code">cs = </text>
  <text x="116" y="272" class="type">CString</text>
  <text x="162" y="272" class="code">::</text>
  <text x="174" y="272" class="fn">new</text>
  <text x="198" y="272" class="code">(</text>
  <text x="206" y="272" class="str">"hola"</text>
  <text x="242" y="272" class="code">)</text>
  <text x="254" y="272" class="code">.</text>
  <text x="260" y="272" class="fn">unwrap</text>
  <text x="304" y="272" class="code">();</text>

  <text x="68" y="290" class="comment">// as_ptr() → *const c_char (válido mientras cs vive)</text>
  <text x="68" y="306" class="code">cs.</text>
  <text x="86" y="306" class="fn">as_ptr</text>
  <text x="128" y="306" class="code">();</text>

  <text x="68" y="324" class="comment">// into_raw() transfiere ownership a C</text>
  <text x="68" y="340" class="kw">let </text>
  <text x="90" y="340" class="code">raw = cs.</text>
  <text x="148" y="340" class="fn">into_raw</text>
  <text x="198" y="340" class="code">();</text>

  <text x="68" y="356" class="comment">// ← C debe llamar rust_free_string(raw)</text>
  <text x="68" y="372" class="comment">// Nunca: libc::free(raw) ← UB!</text>

  <rect x="460" y="208" width="400" height="180" rx="6" fill="#252526" stroke="#454545"/>
  <text x="660" y="228" text-anchor="middle" class="label" font-weight="700">CStr — Rust interpreta de C</text>
  <text x="660" y="246" text-anchor="middle" class="small">Borrowed view · no copia · no-owned</text>

  <rect x="476" y="256" width="368" height="118" rx="4" fill="#2d2d2d"/>
  <text x="488" y="272" class="comment">// fn saludar(name: *const c_char)</text>
  <text x="488" y="290" class="kw">if </text>
  <text x="508" y="290" class="code">name.</text>
  <text x="546" y="290" class="fn">is_null</text>
  <text x="594" y="290" class="code">() { </text>
  <text x="624" y="290" class="kw">return</text>
  <text x="670" y="290" class="code">; }</text>
  <text x="488" y="308" class="comment">// SAFETY: verificamos null; C garantiza</text>
  <text x="488" y="322" class="comment">// cadena válida con null terminator.</text>
  <text x="488" y="338" class="kw">let </text>
  <text x="510" y="338" class="code">cs = </text>
  <text x="532" y="338" class="kw">unsafe </text>
  <text x="576" y="338" class="code">{</text>
  <text x="490" y="354" class="type">CStr</text>
  <text x="518" y="354" class="code">::</text>
  <text x="530" y="354" class="fn">from_ptr</text>
  <text x="582" y="354" class="code">(name) };</text>
  <text x="490" y="370" class="kw">let </text>
  <text x="512" y="370" class="code">s = cs.</text>
  <text x="558" y="370" class="fn">to_string_lossy</text>
  <text x="648" y="370" class="code">();</text>

  <!-- BOTTOM: Danger zone -->
  <rect x="40" y="408" width="820" height="112" rx="6" fill="#1e1e1e" stroke="#CE422B" stroke-width="1.5"/>
  <text x="450" y="428" text-anchor="middle" class="label" font-weight="700" fill="#CE422B">⚠️ Peligros: Dangling Pointer</text>

  <!-- Wrong example -->
  <rect x="56" y="438" width="376" height="68" rx="4" fill="#CE422B" fill-opacity="0.08" stroke="#CE422B" stroke-opacity="0.4"/>
  <text x="68" y="454" class="danger">❌ INCORRECTO — dangling pointer</text>
  <text x="68" y="470" class="kw">let </text>
  <text x="90" y="470" class="code">ptr = {</text>
  <text x="68" y="486" class="kw">  let </text>
  <text x="92" y="486" class="code">cs = </text>
  <text x="116" y="486" class="type">CString</text>
  <text x="162" y="486" class="code">::</text>
  <text x="174" y="486" class="fn">new</text>
  <text x="198" y="486" class="code">(</text>
  <text x="206" y="486" class="str">"hi"</text>
  <text x="228" y="486" class="code">).</text>
  <text x="240" y="486" class="fn">unwrap</text>
  <text x="284" y="486" class="code">();</text>
  <text x="68" y="502" class="code">  cs.</text>
  <text x="92" y="502" class="fn">as_ptr</text>
  <text x="134" y="502" class="code">() </text>
  <text x="152" y="502" class="comment">// cs droppea aquí!</text>
  <text x="68" y="502" class="code">};</text>

  <!-- Correct example -->
  <rect x="452" y="438" width="392" height="68" rx="4" fill="#6a9955" fill-opacity="0.08" stroke="#6a9955" stroke-opacity="0.4"/>
  <text x="464" y="454" class="comment">✅ CORRECTO — lifetime explícito</text>
  <text x="464" y="470" class="kw">let </text>
  <text x="486" y="470" class="code">cs = </text>
  <text x="510" y="470" class="type">CString</text>
  <text x="556" y="470" class="code">::</text>
  <text x="568" y="470" class="fn">new</text>
  <text x="592" y="470" class="code">(</text>
  <text x="600" y="470" class="str">"hi"</text>
  <text x="622" y="470" class="code">).</text>
  <text x="634" y="470" class="fn">unwrap</text>
  <text x="678" y="470" class="code">();</text>
  <text x="464" y="486" class="kw">let </text>
  <text x="486" y="486" class="code">n = </text>
  <text x="506" y="486" class="kw">unsafe </text>
  <text x="550" y="486" class="code">{ </text>
  <text x="560" y="486" class="fn">strlen</text>
  <text x="600" y="486" class="code">(cs.</text>
  <text x="626" y="486" class="fn">as_ptr</text>
  <text x="670" y="486" class="code">()) };</text>
  <text x="464" y="502" class="comment">// cs droppea aquí — después de usar ptr ✓</text>
</svg>
