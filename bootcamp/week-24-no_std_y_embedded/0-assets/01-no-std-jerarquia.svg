<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520">
  <style>
    .title    { font-family: 'Segoe UI', sans-serif; font-size: 22px; font-weight: bold; fill: #d4d4d4; }
    .subtitle { font-family: 'Segoe UI', sans-serif; font-size: 13px; fill: #808080; }
    .label    { font-family: 'Segoe UI', sans-serif; font-size: 13px; fill: #d4d4d4; }
    .small    { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #808080; }
    .code     { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #d4d4d4; }
    .kw       { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #569cd6; }
    .ty       { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #4ec9b0; }
    .attr     { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #9cdcfe; }
    .str      { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #ce9178; }
    .comment  { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #6a9955; }
    .good     { fill: #4ec9b0; }
    .bad      { fill: #f44747; }
    .warn     { fill: #dcdcaa; }
  </style>

  <rect width="860" height="520" fill="#1e1e1e"/>

  <!-- Header -->
  <rect x="0" y="0" width="860" height="56" fill="#252526"/>
  <rect x="0" y="0" width="4" height="56" fill="#CE422B"/>
  <text x="24" y="26" class="title">Semana 24 — Jerarquía: core / alloc / std</text>
  <text x="24" y="45" class="subtitle">#![no_std] · qué se pierde · qué queda disponible · entornos</text>

  <!-- ===== PIRÁMIDE DE CAPAS ===== -->
  <!-- std layer (top) -->
  <rect x="200" y="68" width="460" height="66" rx="6" fill="#252526" stroke="#CE422B" stroke-width="2"/>
  <text x="430" y="90" class="label" font-weight="bold" text-anchor="middle" fill="#CE422B">std</text>
  <text x="430" y="108" class="small" text-anchor="middle">Vec, String, File, Thread, Mutex, TcpStream, HashMap…</text>
  <text x="430" y="124" class="small" text-anchor="middle" fill="#f44747">Requiere sistema operativo + allocator</text>

  <!-- alloc layer (middle) -->
  <rect x="120" y="146" width="620" height="66" rx="6" fill="#252526" stroke="#dcdcaa" stroke-width="2"/>
  <text x="430" y="168" class="label" font-weight="bold" text-anchor="middle" fill="#dcdcaa">alloc</text>
  <text x="430" y="186" class="small" text-anchor="middle">Box&lt;T&gt;, Rc&lt;T&gt;, Arc&lt;T&gt;, Vec&lt;T&gt;, String, BTreeMap…</text>
  <text x="430" y="202" class="small" text-anchor="middle" fill="#dcdcaa">Requiere allocator global (#[global_allocator]) — sin OS</text>

  <!-- core layer (base) -->
  <rect x="20" y="224" width="820" height="66" rx="6" fill="#252526" stroke="#4ec9b0" stroke-width="2"/>
  <text x="430" y="246" class="label" font-weight="bold" text-anchor="middle" fill="#4ec9b0">core</text>
  <text x="430" y="264" class="small" text-anchor="middle">Option, Result, Iterator, fmt, mem, ptr, cmp, ops, sync::atomic, num…</text>
  <text x="430" y="280" class="small" text-anchor="middle" fill="#4ec9b0">Siempre disponible — sin OS, sin heap, sin nada externo</text>

  <!-- flechas de contenencia -->
  <text x="100" y="110" class="small" text-anchor="middle" fill="#808080">contiene</text>
  <text x="100" y="180" class="small" text-anchor="middle" fill="#808080">contiene</text>
  <line x1="100" y1="116" x2="100" y2="146" stroke="#454545" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="100" y1="136" x2="100" y2="224" stroke="#454545" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- ===== TABLA: qué hay en cada capa ===== -->
  <rect x="20" y="306" width="400" height="194" rx="6" fill="#252526" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="20" y="306" width="400" height="26" rx="6" fill="#2d2d2d"/>
  <rect x="20" y="318" width="400" height="14" fill="#2d2d2d"/>
  <text x="36" y="325" class="label" font-weight="bold">Qué está disponible con <tspan fill="#CE422B">#![no_std]</tspan></text>

  <!-- col headers -->
  <text x="36"  y="350" class="small" font-weight="bold" fill="#d4d4d4">Módulo</text>
  <text x="200" y="350" class="small" font-weight="bold" fill="#d4d4d4">no_std</text>
  <text x="290" y="350" class="small" font-weight="bold" fill="#d4d4d4">Alternativa</text>
  <line x1="30" y1="355" x2="410" y2="355" stroke="#3c3c3c" stroke-width="1"/>

  <text x="36"  y="370" class="code">Option / Result</text>  <text x="200" y="370" class="good">✓ core::</text>
  <text x="36"  y="386" class="code">Iterator</text>         <text x="200" y="386" class="good">✓ core::</text>
  <text x="36"  y="402" class="code">fmt / Debug</text>      <text x="200" y="402" class="good">✓ core::</text>
  <text x="36"  y="418" class="code">mem / ptr</text>        <text x="200" y="418" class="good">✓ core::</text>
  <text x="36"  y="434" class="code">sync::atomic</text>     <text x="200" y="434" class="good">✓ core::</text>
  <text x="36"  y="450" class="code">Vec / String</text>     <text x="200" y="450" class="bad">✗ std::</text>   <text x="290" y="450" class="code">heapless::</text>
  <text x="36"  y="466" class="code">println!</text>         <text x="200" y="466" class="bad">✗ macro</text>  <text x="290" y="466" class="code">fmt::Write</text>
  <text x="36"  y="482" class="code">thread / Mutex</text>   <text x="200" y="482" class="bad">✗ std::</text>   <text x="290" y="482" class="code">RTIC</text>

  <!-- ===== TABLA: cuándo usar cada capa ===== -->
  <rect x="436" y="306" width="404" height="194" rx="6" fill="#252526" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="436" y="306" width="404" height="26" rx="6" fill="#2d2d2d"/>
  <rect x="436" y="318" width="404" height="14" fill="#2d2d2d"/>
  <text x="452" y="325" class="label" font-weight="bold">Cuándo usar cada capa</text>

  <text x="452" y="356" class="label" font-weight="bold" fill="#4ec9b0">core</text>
  <text x="452" y="374" class="small">Microcontrolador (ARM Cortex-M, RISC-V)</text>
  <text x="452" y="390" class="small">Bootloader / firmware bare metal</text>
  <text x="452" y="406" class="small">Librería portable entre entornos</text>

  <line x1="446" y1="414" x2="830" y2="414" stroke="#3c3c3c" stroke-width="1" stroke-dasharray="4"/>

  <text x="452" y="430" class="label" font-weight="bold" fill="#dcdcaa">alloc</text>
  <text x="452" y="448" class="small">MCU con SRAM suficiente + RTOS con heap</text>
  <text x="452" y="464" class="small">Librería que necesita Vec pero sin OS</text>

  <line x1="446" y1="472" x2="830" y2="472" stroke="#3c3c3c" stroke-width="1" stroke-dasharray="4"/>

  <text x="452" y="488" class="label" font-weight="bold" fill="#CE422B">std</text>
  <text x="452" y="504" class="small">Linux, macOS, Windows — programas normales</text>

  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#454545"/>
    </marker>
  </defs>
</svg>
