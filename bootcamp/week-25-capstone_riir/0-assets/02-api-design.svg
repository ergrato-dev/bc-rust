<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 570">
  <style>
    .title    { font-family: 'Segoe UI', sans-serif; font-size: 22px; font-weight: bold; fill: #d4d4d4; }
    .subtitle { font-family: 'Segoe UI', sans-serif; font-size: 13px; fill: #808080; }
    .label    { font-family: 'Segoe UI', sans-serif; font-size: 13px; fill: #d4d4d4; }
    .small    { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #808080; }
    .code     { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #d4d4d4; }
    .kw       { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #569cd6; }
    .fn       { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #dcdcaa; }
    .ty       { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #4ec9b0; }
    .attr     { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #9cdcfe; }
    .str      { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #ce9178; }
    .num      { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #b5cea8; }
    .comment  { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #6a9955; }
    .good     { fill: #4ec9b0; }
    .bad      { fill: #f44747; }
  </style>

  <rect width="860" height="570" fill="#1e1e1e"/>

  <!-- Header -->
  <rect x="0" y="0" width="860" height="56" fill="#252526"/>
  <rect x="0" y="0" width="4" height="56" fill="#CE422B"/>
  <text x="24" y="26" class="title">Semana 25 — Diseño de API Pública en Rust</text>
  <text x="24" y="45" class="subtitle">Rust API Guidelines · Builder pattern · Error types · #![deny(missing_docs)]</text>

  <!-- ===== NOMENCLATURA ===== -->
  <rect x="20" y="68" width="400" height="188" rx="6" fill="#252526" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="20" y="68" width="400" height="26" rx="6" fill="#2d2d2d"/>
  <rect x="20" y="80" width="400" height="14" fill="#2d2d2d"/>
  <text x="36" y="87" class="label" font-weight="bold">Nomenclatura idiomática</text>

  <text x="30" y="114" class="comment">// Constructores</text>
  <text x="30" y="130" class="kw">impl </text><text x="54" y="130" class="ty">Config</text><text x="90" y="130" class="code"> {</text>
  <text x="42" y="146" class="kw">pub fn </text><text x="80" y="146" class="fn">new</text><text x="100" y="146" class="code">() -> </text><text x="130" y="146" class="ty">Self</text><text x="154" y="146" class="code"> { … }</text>
  <text x="42" y="162" class="kw">pub fn </text><text x="80" y="162" class="fn">from_str</text><text x="120" y="162" class="code">(s: &amp;</text><text x="148" y="162" class="ty">str</text><text x="164" y="162" class="code">) -> </text><text x="192" y="162" class="ty">Result</text><text x="222" y="162" class="code">&lt;</text><text x="228" y="162" class="ty">Self</text><text x="252" y="162" class="code">, </text><text x="260" y="162" class="ty">ParseErr</text><text x="306" y="162" class="code">&gt; { … }</text>

  <text x="30" y="182" class="comment">// Getters sin prefijo get_</text>
  <text x="30" y="198" class="kw">pub fn </text><text x="68" y="198" class="fn">nombre</text><text x="104" y="198" class="code">(&amp;</text><text x="116" y="198" class="kw">self</text><text x="136" y="198" class="code">) -> &amp;</text><text x="162" y="198" class="ty">str</text><text x="178" y="198" class="code"> { … }  </text><text x="234" y="198" class="comment">// ✅</text>
  <text x="30" y="214" class="comment">// pub fn get_nombre  ← ❌ no idiomático</text>

  <text x="30" y="234" class="comment">// Conversiones: as_ (borrow) · to_ (alloc) · into_ (own)</text>
  <text x="30" y="250" class="kw">pub fn </text><text x="68" y="250" class="fn">as_bytes</text><text x="112" y="250" class="code">(&amp;</text><text x="124" y="250" class="kw">self</text><text x="144" y="250" class="code">) -> &amp;[</text><text x="168" y="250" class="ty">u8</text><text x="180" y="250" class="code">] { … }</text>

  <!-- ===== ERROR TYPES ===== -->
  <rect x="440" y="68" width="400" height="196" rx="6" fill="#252526" stroke="#CE422B" stroke-width="1.5"/>
  <rect x="440" y="68" width="400" height="26" rx="6" fill="#2d2d2d"/>
  <rect x="440" y="80" width="400" height="14" fill="#2d2d2d"/>
  <text x="456" y="87" class="label" font-weight="bold" fill="#CE422B">Tipos de Error — std::error::Error</text>

  <text x="450" y="114" class="attr">#[derive(Debug)]</text>
  <text x="450" y="130" class="kw">pub enum </text><text x="500" y="130" class="ty">ParseError</text><text x="564" y="130" class="code"> {</text>
  <text x="462" y="146" class="comment">/// Carácter inesperado en pos.</text>
  <text x="462" y="162" class="ty">  CaracterInvalido </text><text x="570" y="162" class="code">{ </text><text x="582" y="162" class="attr">pos</text><text x="606" y="162" class="code">: </text><text x="612" y="162" class="ty">usize</text><text x="642" y="162" class="code">, </text><text x="650" y="162" class="attr">c</text><text x="658" y="162" class="code">: </text><text x="664" y="162" class="ty">char</text><text x="688" y="162" class="code"> },</text>
  <text x="462" y="178" class="ty">  ExpresionVacia</text><text x="558" y="178" class="code">,</text>
  <text x="450" y="194" class="code">}</text>
  <text x="450" y="214" class="kw">impl </text><text x="474" y="214" class="ty">fmt</text><text x="492" y="214" class="code">::</text><text x="498" y="214" class="ty">Display</text><text x="534" y="214" class="kw"> for </text><text x="560" y="214" class="ty">ParseError</text><text x="624" y="214" class="code"> { … }</text>
  <text x="450" y="230" class="kw">impl </text><text x="474" y="230" class="ty">std</text><text x="492" y="230" class="code">::</text><text x="498" y="230" class="ty">error</text><text x="522" y="230" class="code">::</text><text x="528" y="230" class="ty">Error</text><text x="552" y="230" class="kw"> for </text><text x="578" y="230" class="ty">ParseError</text><text x="642" y="230" class="code"> {}</text>
  <text x="450" y="252" class="comment">// Result type alias en lib.rs:</text>
  <text x="450" y="268" class="kw">pub type </text><text x="498" y="268" class="ty">Result</text><text x="534" y="268" class="code">&lt;T&gt; = std::</text><text x="604" y="268" class="ty">Result</text><text x="640" y="268" class="code">&lt;T, </text><text x="666" y="268" class="ty">ParseError</text><text x="730" y="268" class="code">&gt;;</text>

  <!-- ===== BUILDER PATTERN ===== -->
  <rect x="20" y="272" width="400" height="172" rx="6" fill="#252526" stroke="#569cd6" stroke-width="1.5"/>
  <rect x="20" y="272" width="400" height="26" rx="6" fill="#2d2d2d"/>
  <rect x="20" y="284" width="400" height="14" fill="#2d2d2d"/>
  <text x="36" y="291" class="label" font-weight="bold" fill="#569cd6">Builder Pattern</text>

  <text x="30" y="318" class="kw">pub struct </text><text x="90" y="318" class="ty">MotorConfigBuilder</text><text x="216" y="318" class="code"> { inner: </text><text x="270" y="318" class="ty">MotorConfig</text><text x="336" y="318" class="code"> }</text>

  <text x="30" y="338" class="kw">impl </text><text x="54" y="338" class="ty">MotorConfigBuilder</text><text x="180" y="338" class="code"> {</text>
  <text x="42" y="354" class="kw">  pub fn </text><text x="90" y="354" class="fn">precision</text><text x="138" y="354" class="code">(</text><text x="144" y="354" class="kw">mut </text><text x="164" y="354" class="kw">self</text><text x="184" y="354" class="code">, p: </text><text x="212" y="354" class="ty">u32</text><text x="228" y="354" class="code">) -> </text><text x="256" y="354" class="ty">Self</text><text x="280" y="354" class="code"> {</text>
  <text x="54" y="370" class="code">    </text><text x="54" y="370" class="kw">self</text><text x="74" y="370" class="code">.inner.precision = p; </text><text x="202" y="370" class="kw">self</text>
  <text x="42" y="386" class="code">  }</text>
  <text x="42" y="402" class="kw">  pub fn </text><text x="90" y="402" class="fn">build</text><text x="118" y="402" class="code">(</text><text x="124" y="402" class="kw">self</text><text x="144" y="402" class="code">) -> </text><text x="172" y="402" class="ty">MotorConfig</text><text x="240" y="402" class="code"> { </text><text x="258" y="402" class="kw">self</text><text x="278" y="402" class="code">.inner }</text>
  <text x="30" y="418" class="code">}</text>
  <text x="30" y="434" class="comment">// uso: MotorConfig::builder().precision(10).build()</text>

  <!-- ===== DENY MISSING DOCS ===== -->
  <rect x="440" y="280" width="400" height="162" rx="6" fill="#252526" stroke="#dcdcaa" stroke-width="1.5"/>
  <rect x="440" y="280" width="400" height="26" rx="6" fill="#2d2d2d"/>
  <rect x="440" y="292" width="400" height="14" fill="#2d2d2d"/>
  <text x="456" y="299" class="label" font-weight="bold" fill="#dcdcaa">#![deny(missing_docs)]</text>

  <text x="450" y="326" class="attr">#![deny(missing_docs)]</text>
  <text x="450" y="342" class="comment">//! # nombre-del-crate</text>
  <text x="450" y="358" class="comment">//!</text>
  <text x="450" y="374" class="comment">//! ## Ejemplo rápido</text>
  <text x="450" y="390" class="comment">//! ```</text>
  <text x="450" y="406" class="comment">//! let p = Procesador::new();</text>
  <text x="450" y="422" class="comment">//! assert_eq!(p.procesar("hi"), "HI");</text>
  <text x="450" y="438" class="comment">//! ```</text>

  <!-- ===== TABLA GUÍAS ===== -->
  <rect x="20"  y="458" width="820" height="100" rx="6" fill="#252526" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="20"  y="458" width="820" height="26"  rx="6" fill="#2d2d2d"/>
  <rect x="20"  y="470" width="820" height="14"  fill="#2d2d2d"/>
  <text x="36"  y="477" class="label" font-weight="bold">Rust API Guidelines — Resumen de reglas clave</text>

  <text x="36"  y="504" class="small" fill="#CE422B" font-weight="bold">Naming:</text>
  <text x="90"  y="504" class="small">snake_case funciones · PascalCase tipos · SCREAMING_SNAKE constantes · iteradores en _iter()/_into_iter()</text>
  <text x="36"  y="520" class="small" fill="#CE422B" font-weight="bold">Interop:</text>
  <text x="94"  y="520" class="small">Impl From/Into para conversiones · AsRef/Borrow para aceptar múltiples tipos · impl IntoIterator en colecciones</text>
  <text x="36"  y="536" class="small" fill="#CE422B" font-weight="bold">Docs:</text>
  <text x="76"  y="536" class="small">/// en toda API pública · # Examples compilables · # Errors y # Panics cuando aplica · #![deny(missing_docs)]</text>
  <text x="36"  y="552" class="small" fill="#CE422B" font-weight="bold">Errores:</text>
  <text x="100" y="552" class="small">Error + Display + Debug · enum por módulo · evitar string errors · context con thiserror o anyhow (en apps)</text>
</svg>
