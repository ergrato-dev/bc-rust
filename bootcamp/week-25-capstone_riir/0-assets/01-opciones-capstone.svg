<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560">
  <style>
    .title    { font-family: 'Segoe UI', sans-serif; font-size: 22px; font-weight: bold; fill: #d4d4d4; }
    .subtitle { font-family: 'Segoe UI', sans-serif; font-size: 13px; fill: #808080; }
    .label    { font-family: 'Segoe UI', sans-serif; font-size: 13px; fill: #d4d4d4; }
    .small    { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #808080; }
    .code     { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #d4d4d4; }
    .kw       { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #569cd6; }
    .str      { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #ce9178; }
    .comment  { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #6a9955; }
    .opt      { font-family: 'Segoe UI', sans-serif; font-size: 26px; font-weight: bold; }
  </style>

  <rect width="860" height="560" fill="#1e1e1e"/>

  <!-- Header -->
  <rect x="0" y="0" width="860" height="56" fill="#252526"/>
  <rect x="0" y="0" width="4" height="56" fill="#CE422B"/>
  <text x="24" y="26" class="title">Semana 25 — Capstone RIIR: Las 4 Opciones</text>
  <text x="24" y="45" class="subtitle">Rewrite It In Rust — elige un proyecto, intégralo con un ecosistema externo</text>

  <!-- ===== OPCIÓN A ===== -->
  <rect x="20"  y="68" width="400" height="222" rx="6" fill="#252526" stroke="#CE422B" stroke-width="2"/>
  <rect x="20"  y="68" width="400" height="32"  rx="6" fill="#CE422B" fill-opacity="0.18"/>
  <rect x="20"  y="86" width="400" height="14"  fill="#CE422B" fill-opacity="0.18"/>
  <text x="60"  y="90" class="opt" fill="#CE422B">A</text>
  <text x="88"  y="84" class="label" font-weight="bold">Parser/Lexer expuesto a Python</text>
  <text x="88"  y="98" class="small">PyO3 + maturin — módulo .so/.pyd importable</text>

  <text x="34"  y="124" class="small" fill="#d4d4d4" font-weight="bold">Stack:</text>
  <text x="34"  y="140" class="code">pyo3 = </text><text x="76"  y="140" class="str">"0.23.4"</text>
  <text x="34"  y="156" class="small">maturin develop  →  maturin build --release</text>

  <text x="34"  y="176" class="small" fill="#d4d4d4" font-weight="bold">Salida:</text>
  <text x="34"  y="192" class="code">capstone_opcion_a.cpython-312-x86_64.so</text>
  <text x="34"  y="208" class="comment">// from capstone_opcion_a import tokenizar, evaluar</text>

  <text x="34"  y="228" class="small" fill="#d4d4d4" font-weight="bold">Ideal si:</text>
  <text x="34"  y="244" class="small">• Quieres ver el impacto directo en performance Python</text>
  <text x="34"  y="260" class="small">• Tienes experiencia en data-science o scripting Python</text>
  <text x="34"  y="276" class="small">• El proyecto anterior usa NumPy / pandas</text>

  <!-- ===== OPCIÓN B ===== -->
  <rect x="440" y="68" width="400" height="222" rx="6" fill="#252526" stroke="#569cd6" stroke-width="2"/>
  <rect x="440" y="68" width="400" height="32"  rx="6" fill="#569cd6" fill-opacity="0.15"/>
  <rect x="440" y="86" width="400" height="14"  fill="#569cd6" fill-opacity="0.15"/>
  <text x="480" y="90" class="opt" fill="#569cd6">B</text>
  <text x="508" y="84" class="label" font-weight="bold">CLI Tool — reemplaza `wc`</text>
  <text x="508" y="98" class="small">clap + indicatif — binario nativo multiplataforma</text>

  <text x="454" y="124" class="small" fill="#d4d4d4" font-weight="bold">Stack:</text>
  <text x="454" y="140" class="code">clap = </text><text x="496" y="140" class="str">"4.5.40"</text>
  <text x="454" y="156" class="small">cargo install --path .  →  rwc archivo.txt</text>

  <text x="454" y="176" class="small" fill="#d4d4d4" font-weight="bold">Salida:</text>
  <text x="454" y="192" class="code">rwc -l -w -c archivo.txt</text>
  <text x="454" y="208" class="comment">//       8      42     321 archivo.txt</text>

  <text x="454" y="228" class="small" fill="#d4d4d4" font-weight="bold">Ideal si:</text>
  <text x="454" y="244" class="small">• Quieres la opción más portable (no runtime externo)</text>
  <text x="454" y="260" class="small">• Tienes experiencia en herramientas de terminal</text>
  <text x="454" y="276" class="small">• Valoras la UX de línea de comandos</text>

  <!-- ===== OPCIÓN C ===== -->
  <rect x="20"  y="304" width="400" height="222" rx="6" fill="#252526" stroke="#dcdcaa" stroke-width="2"/>
  <rect x="20"  y="304" width="400" height="32"  rx="6" fill="#dcdcaa" fill-opacity="0.12"/>
  <rect x="20"  y="322" width="400" height="14"  fill="#dcdcaa" fill-opacity="0.12"/>
  <text x="60"  y="326" class="opt" fill="#dcdcaa">C</text>
  <text x="88"  y="320" class="label" font-weight="bold">Motor numérico compilado a WASM</text>
  <text x="88"  y="334" class="small">wasm-bindgen + wasm-pack — módulo npm / browser</text>

  <text x="34"  y="360" class="small" fill="#d4d4d4" font-weight="bold">Stack:</text>
  <text x="34"  y="376" class="code">wasm-bindgen = </text><text x="142" y="376" class="str">"0.2.100"</text>
  <text x="34"  y="392" class="small">wasm-pack build --target web  →  pkg/</text>

  <text x="34"  y="412" class="small" fill="#d4d4d4" font-weight="bold">Salida:</text>
  <text x="34"  y="428" class="code">import { Estadisticas } from './pkg/…'</text>
  <text x="34"  y="444" class="comment">// stats.media()  stats.desviacion_std()</text>

  <text x="34"  y="464" class="small" fill="#d4d4d4" font-weight="bold">Ideal si:</text>
  <text x="34"  y="480" class="small">• Tu objetivo es el ecosistema web / front-end</text>
  <text x="34"  y="496" class="small">• Quieres publicar en npm</text>
  <text x="34"  y="512" class="small">• Tienes familiaridad con JavaScript/TypeScript</text>

  <!-- ===== OPCIÓN D ===== -->
  <rect x="440" y="304" width="400" height="222" rx="6" fill="#252526" stroke="#4ec9b0" stroke-width="2"/>
  <rect x="440" y="304" width="400" height="32"  rx="6" fill="#4ec9b0" fill-opacity="0.12"/>
  <rect x="440" y="322" width="400" height="14"  fill="#4ec9b0" fill-opacity="0.12"/>
  <text x="480" y="326" class="opt" fill="#4ec9b0">D</text>
  <text x="508" y="320" class="label" font-weight="bold">Librería criptográfica con API C</text>
  <text x="508" y="334" class="small">libc + cbindgen — .so/.a + header autogenerado</text>

  <text x="454" y="360" class="small" fill="#d4d4d4" font-weight="bold">Stack:</text>
  <text x="454" y="376" class="code">libc = </text><text x="496" y="376" class="str">"0.2.172"</text>
  <text x="454" y="392" class="small">build.rs genera hash.h  →  gcc demo.c -lhash</text>

  <text x="454" y="412" class="small" fill="#d4d4d4" font-weight="bold">Salida:</text>
  <text x="454" y="428" class="code">uint64_t fnv1a_64(const uint8_t*, size_t);</text>
  <text x="454" y="444" class="comment">// Usable desde C, Go, Python ctypes, …</text>

  <text x="454" y="464" class="small" fill="#d4d4d4" font-weight="bold">Ideal si:</text>
  <text x="454" y="480" class="small">• Quieres profundizar en unsafe y ABI</text>
  <text x="454" y="496" class="small">• Tienes experiencia en C/C++</text>
  <text x="454" y="512" class="small">• El objetivo es la máxima portabilidad entre lenguajes</text>

  <!-- criterio comun -->
  <rect x="20" y="536" width="820" height="18" rx="3" fill="#2d2d2d"/>
  <text x="36" y="549" class="small" fill="#CE422B" font-weight="bold">Criterio común a todas: </text>
  <text x="152" y="549" class="small" fill="#d4d4d4">#![deny(missing_docs)]  · cargo clippy -D warnings  · cargo test  · cargo audit  · README con ejemplos reales</text>
</svg>
